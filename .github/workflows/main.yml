name: Build SMPPlugin

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'logs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build with Gradle
        run: |
          mkdir -p logs
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee "logs/failure-${{ github.run_number }}.log"

      - name: Publish JAR to GitHub Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: "${{ github.event.head_commit.message }} (Automated build)"
          files: build/libs/*.jar

      - name: Save Failure Log to Repository
        if: failure() && hashFiles('logs/failure-*.log') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add "logs/failure-${{ github.run_number }}.log"
          git commit -m "Build #${{ github.run_number }} failure log [skip ci]"
          git push
