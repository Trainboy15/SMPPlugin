ah:
  title: "&8Auction (Page %page%/%maxpage%)"
  size: 54
  OptionSelectedPrefix: "&b• &b"
  OptionUnselectedPrefix: "&f◦ &f"
  items:
    '45':
      material: ARROW
      name: "&bPrevious Page"
      action: previous
      options:
        - "&fClick to view the previous page"
    '47':
      material: CAULDRON
      name: "&bFilter"
      action: filter
      options:
        - "All Items"
        - "Blocks"
        - "Tools"
        - "Food"
        - "Combat"
        - "Potions"
        - "Books"
        - "Ingredients"
        - "Utilities"
    '48':
      material: HOPPER
      name: "&bSort"
      action: sort
      options:
        - "Recently Listed"
        - "Oldest First"
        - "Most Expensive"
        - "Cheapest First"
    '49':
      material: ANVIL
      name: "&bAuction"
      action: refresh
      options:
        - "&fClick to refresh"
        - "&7Sell an item with"
        - "&7/ah sell <price>"
    '50':
      material: OAK_SIGN
      name: "&bSearch"
      action: search
      options:
        - "&fClick to search"
    '51':
      material: CHEST
      name: "&bYour Items"
      action: own
      options:
        - "&fClick to view the items you have listed"
    '53':
      material: ARROW
      name: "&bNext Page"
      action: next
      options:
        - "&fClick to view the next page"

  