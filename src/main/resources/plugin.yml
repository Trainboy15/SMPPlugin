name: SMPPlugin
version: '${version}'
main: trainboy15.smpplugin.SMPPlugin
api-version: '1.21'
depend: [Vault]
description: DonutSMP like SMP plugin
authors: [Trainboy15]

commands:
  smp:
    description: Main SMP command
    usage: /smp
    permission: smp.player
  help:
    description: Help command
    usage: /help
    permission: smp.player
  shop:
    description: Shop command
    usage: /shop
    permission: smp.player
  ah:
    description: Ah command
    usage: /ah
    permission: smp.player
  orders:
    description: Orders command
    usage: /orders
    permission: smp.player
  settings:
    description: Settings command
    usage: /settings
    permission: smp.player
  shardshop:
    description: Opens the shardshop
    usage: /shardshop
    permission: smp.player
  admin:
    description: Player management
    usage: /admin <player>
    permission: smp.admin
  reload:
    description: Reloads plugin config
    permission: smp.admin

permissions:
  smp.player:
    description: Basic player commands
    default: true
  smp.admin:
    description: Access to SMP admin commands
    default: op
